<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Slicer Glitch Engine v6.0</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: #111827;
            --panel-border: #1f2937;
            --accent-primary: #f43f5e;
            --accent-hover: #e11d48;
            --accent-cyan: #06b6d4;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .workspace {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Tombol Upload Estetik */
        .upload-area {
            position: relative;
            background: #0f172a;
            border: 2px dashed var(--panel-border);
            border-radius: 8px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--accent-cyan);
            background: #1e293b;
        }

        .upload-area input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 2;
        }

        .upload-text {
            color: var(--accent-cyan);
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Area Canvas */
        .canvas-container {
            width: 100%;
            background: #000;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
        }

        /* Panel Kontrol */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-item label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
    </style>
</head>
<body>

    <div class="header">
        <h1>Pixel Slicer v6.0</h1>
        <p>Potong, Acak, dan Geser Baris Piksel secara Real-Time</p>
    </div>

    <div class="workspace">
        
        <div class="upload-area" id="uploadWrapper">
            <input type="file" id="imageUpload" accept="image/*">
            <div class="upload-text" id="uploadLabel">
                <span style="font-size: 1.5rem;">+</span> Unggah Gambar Target
            </div>
        </div>

        <div class="control-panel">
            <div class="control-item">
                <label>Ketebalan Baris (Slice) <span id="valThick">10px</span></label>
                <input type="range" id="sliceThickness" min="1" max="100" value="10">
            </div>
            <div class="control-item">
                <label>Intensitas Acak (Chaos) <span id="valChaos">50%</span></label>
                <input type="range" id="chaosLevel" min="0" max="100" value="50">
            </div>
            <div class="control-item">
                <label>Tearing (Geser Kiri/Kanan) <span id="valShift">20px</span></label>
                <input type="range" id="horizontalShift" min="0" max="200" value="20">
            </div>
        </div>

        <div class="btn-group">
            <button id="btnGlitch" class="btn" disabled>⚡ Terapkan Glitch</button>
            <button id="btnReset" class="btn btn-secondary" disabled>🔄 Reset</button>
            <button id="btnDownload" class="btn btn-secondary" style="border-color: var(--accent-cyan); color: var(--accent-cyan);" disabled>💾 Simpan</button>
        </div>

        <div class="canvas-container">
            <canvas id="displayCanvas"></canvas>
        </div>

    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const uploadLabel = document.getElementById('uploadLabel');
        const displayCanvas = document.getElementById('displayCanvas');
        const ctx = displayCanvas.getContext('2d');
        
        // Canvas tersembunyi untuk menyimpan gambar asli yang belum rusak
        const originalCanvas = document.createElement('canvas');
        const originalCtx = originalCanvas.getContext('2d');

        // Sliders & Buttons
        const sliceThickness = document.getElementById('sliceThickness');
        const chaosLevel = document.getElementById('chaosLevel');
        const horizontalShift = document.getElementById('horizontalShift');
        
        const btnGlitch = document.getElementById('btnGlitch');
        const btnReset = document.getElementById('btnReset');
        const btnDownload = document.getElementById('btnDownload');

        let imgLoaded = false;

        // Update Slider Labels
        function updateLabels() {
            document.getElementById('valThick').innerText = sliceThickness.value + 'px';
            document.getElementById('valChaos').innerText = chaosLevel.value + '%';
            document.getElementById('valShift').innerText = horizontalShift.value + 'px';
        }
        [sliceThickness, chaosLevel, horizontalShift].forEach(el => el.addEventListener('input', updateLabels));

        // Handle Image Upload
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Set ukuran canvas asli dan canvas tampilan
                    originalCanvas.width = img.width;
                    originalCanvas.height = img.height;
                    displayCanvas.width = img.width;
                    displayCanvas.height = img.height;

                    // Gambar ke canvas memori (backup)
                    originalCtx.drawImage(img, 0, 0);
                    
                    // Tampilkan gambar utuh di awal
                    resetImage();
                    
                    imgLoaded = true;
                    uploadLabel.innerHTML = `✓ Gambar Dimuat (${img.width}x${img.height})`;
                    btnGlitch.disabled = false;
                    btnReset.disabled = false;
                    btnDownload.disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function resetImage() {
            if(!imgLoaded) return;
            ctx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
            ctx.drawImage(originalCanvas, 0, 0);
        }

        // ALGORITMA UTAMA: MEMOTONG & MENGACAK BARIS PIKSEL
        function applyRowGlitch() {
            if (!imgLoaded) return;

            const w = displayCanvas.width;
            const h = displayCanvas.height;
            const maxThick = parseInt(sliceThickness.value);
            const chaos = parseInt(chaosLevel.value) / 100;
            const maxShift = parseInt(horizontalShift.value);

            // 1. Tentukan ukuran irisan horizontal (slices) dari atas ke bawah
            let slices = [];
            let currentY = 0;
            while (currentY < h) {
                // Buat ketebalan acak antara 1px hingga batas slider
                let thick = Math.floor(Math.random() * maxThick) + 1;
                if (currentY + thick > h) thick = h - currentY; // Pas-kan jika di ujung bawah
                
                slices.push({
                    sourceY: currentY,
                    height: thick
                });
                currentY += thick;
            }

            // 2. Acak urutan array irisan tersebut berdasarkan Intensitas Chaos
            let shuffledSlices = [...slices];
            for (let i = shuffledSlices.length - 1; i > 0; i--) {
                // Hanya acak jika nilai random masuk dalam persentase chaos
                if (Math.random() < chaos) {
                    const j = Math.floor(Math.random() * (i + 1));
                    // Tukar posisi (Swap Data)
                    [shuffledSlices[i], shuffledSlices[j]] = [shuffledSlices[j], shuffledSlices[i]];
                }
            }

            // 3. Gambar ulang ke layar dengan posisi baru & pergeseran X (Tearing)
            ctx.clearRect(0, 0, w, h);
            
            let drawY = 0; // Kursor Y untuk menumpuk gambar dari atas
            for (let i = 0; i < shuffledSlices.length; i++) {
                let slice = shuffledSlices[i];
                
                // Menghitung pergeseran horizontal (Tearing) secara acak ke kiri/kanan
                let shiftX = 0;
                if (Math.random() < chaos) {
                    shiftX = Math.floor(Math.random() * (maxShift * 2)) - maxShift; 
                }

                // API DrawImage untuk memindah-mindahkan piksel: 
                // drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
                ctx.drawImage(
                    originalCanvas,       // Sumber data asli
                    0, slice.sourceY,     // Koordinat asli
                    w, slice.height,      // Ukuran irisan sumber
                    shiftX, drawY,        // Koordinat tujuan baru (X digeser, Y ditumpuk baru)
                    w, slice.height       // Ukuran tujuan
                );

                drawY += slice.height; // Turun ke baris berikutnya
            }
        }

        // Event Listeners
        btnGlitch.addEventListener('click', applyRowGlitch);
        btnReset.addEventListener('click', resetImage);
        
        btnDownload.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'glitch_row_slicer.png';
            link.href = displayCanvas.toDataURL('image/png');
            link.click();
        });

    </script>
</body>
</html>
