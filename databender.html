<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Data Bender v5.0 - Glitch Engines</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --panel-border: #333333;
            --accent-blue: #00f3ff;
            --accent-green: #39ff14;
            --accent-red: #ff003c;
            --text-main: #e0e0e0;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--accent-red);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .workspace-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        .grid-slots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (max-width: 900px) { .grid-slots { grid-template-columns: 1fr; } }

        .slot {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upload-canvas-wrapper {
            position: relative;
            cursor: pointer;
            width: 100%;
            height: 42px;
            border-radius: 4px;
            overflow: hidden;
            transition: filter 0.2s;
        }

        .upload-canvas-wrapper:hover { filter: brightness(1.2); }
        .upload-canvas-wrapper input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;
        }
        .upload-btn-canvas { width: 100%; height: 100%; display: block; }

        label { font-size: 0.75rem; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 4px; display: block; }

        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            resize: vertical;
        }
        textarea.editable { color: var(--accent-green); }

        .header-area { height: 45px; }
        .editable-area { height: 100px; }

        /* Panel Mesin Glitch */
        .glitch-engine-panel {
            background: #0a0a0a;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .engine-title {
            color: var(--text-main);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #222;
            color: var(--text-main);
            border: 1px solid #444;
            padding: 12px 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px rgba(255,0,60,0.5);
        }

        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .image-container {
            background-color: #000;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            overflow: hidden;
        }

        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .status-bar { font-size: 0.75rem; color: var(--accent-blue); text-align: center; }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>Base64 Data Bender</h1>
        <div style="color: var(--accent-blue); font-family: monospace;">v5.0_GLITCH_ENGINES</div>
    </header>
    
    <div class="workspace-container">
        
        <div class="grid-slots">
            <div class="slot" id="slotA">
                <div class="upload-canvas-wrapper">
                    <input type="file" id="uploadA" accept="image/*">
                    <canvas id="canvasBtnA" class="upload-btn-canvas"></canvas>
                </div>
                <div>
                    <label>Header Metadata (Terkunci)</label>
                    <textarea id="headerA" class="header-area" readonly></textarea>
                </div>
                <div>
                    <label>Data Piksel Target (A)</label>
                    <textarea id="editableA" class="editable-area editable"></textarea>
                </div>
                <div class="image-container"><img id="previewA"></div>
            </div>

            <div class="slot" id="slotB">
                <div class="upload-canvas-wrapper">
                    <input type="file" id="uploadB" accept="image/*">
                    <canvas id="canvasBtnB" class="upload-btn-canvas"></canvas>
                </div>
                <div>
                    <label>Header Metadata (Terkunci)</label>
                    <textarea id="headerB" class="header-area" readonly></textarea>
                </div>
                <div>
                    <label>Data Piksel Target (B)</label>
                    <textarea id="editableB" class="editable-area editable"></textarea>
                </div>
                <div class="image-container"><img id="previewB"></div>
            </div>
        </div>

        <div class="glitch-engine-panel">
            <div class="engine-title">Mekanisme Kerusakan Data (Glitch Engines)</div>
            <div class="control-group">
                <button id="btnEngine1" class="btn" disabled>Mesin 1: Tukar Silang "/" (Ide User)</button>
                <button id="btnEngine2" class="btn" disabled>Mesin 2: Tukar Blok Besar</button>
                <button id="btnReset" class="btn" style="border-color: var(--accent-blue);" disabled>Restore Asli</button>
            </div>
            <div class="status-bar" id="statusLog">Menunggu dua gambar diunggah...</div>
        </div>

    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const SAFE_PERCENT = 0.15; 
        let originalDataA = "";
        let originalDataB = "";

        const slots = {
            A: { upload: document.getElementById('uploadA'), canvasBtn: document.getElementById('canvasBtnA'), header: document.getElementById('headerA'), editable: document.getElementById('editableA'), preview: document.getElementById('previewA'), color: '#00f3ff' },
            B: { upload: document.getElementById('uploadB'), canvasBtn: document.getElementById('canvasBtnB'), header: document.getElementById('headerB'), editable: document.getElementById('editableB'), preview: document.getElementById('previewB'), color: '#39ff14' }
        };

        const ctx = document.getElementById('hiddenCanvas').getContext('2d');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const statusLog = document.getElementById('statusLog');

        function drawBtn(canvas, text, color, loaded) {
            const c = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            c.fillStyle = loaded ? color : '#111';
            c.fillRect(0,0, canvas.width, canvas.height);
            if(!loaded) { c.strokeStyle = color; c.lineWidth = 2; c.strokeRect(1,1, canvas.width-2, canvas.height-2); }
            c.fillStyle = loaded ? '#000' : color;
            c.font = 'bold 12px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillText(loaded ? `[ DATA ${text} TERMUAT ]` : `> UNGGAH GAMBAR ${text} <`, canvas.width/2, canvas.height/2);
        }

        window.onload = () => { drawBtn(slots.A.canvasBtn, 'A', slots.A.color, false); drawBtn(slots.B.canvasBtn, 'B', slots.B.color, false); };

        function handleUpload(id) {
            slots[id].upload.addEventListener('change', e => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        hiddenCanvas.width = img.width; hiddenCanvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const b64 = hiddenCanvas.toDataURL('image/jpeg', 0.9); // Pakai JPEG karena lebih mentolerir glitch dibanding PNG
                        const split = Math.floor(b64.length * SAFE_PERCENT);
                        
                        slots[id].header.value = b64.substring(0, split);
                        slots[id].editable.value = b64.substring(split);
                        
                        if(id === 'A') originalDataA = slots[id].editable.value;
                        if(id === 'B') originalDataB = slots[id].editable.value;

                        drawBtn(slots[id].canvasBtn, id, slots[id].color, true);
                        updatePreview(id);
                        checkReady();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
            slots[id].editable.addEventListener('input', () => updatePreview(id));
        }

        handleUpload('A'); handleUpload('B');

        function updatePreview(id) { slots[id].preview.src = slots[id].header.value + slots[id].editable.value; }

        function checkReady() {
            if(slots.A.editable.value && slots.B.editable.value) {
                document.querySelectorAll('.btn').forEach(b => b.disabled = false);
                statusLog.innerText = "Mesin siap. Pilih metode pemisahan data.";
            }
        }

        function extractEOF(str) { return str.slice(-8); }
        function removeEOF(str) { return str.slice(0, -8); }

        // ==========================================
        // MESIN 1: TEKNIK SPLIT BERDASARKAN TANDA "/" (Ide User)
        // ==========================================
        document.getElementById('btnEngine1').addEventListener('click', () => {
            let dataA = removeEOF(slots.A.editable.value);
            let dataB = removeEOF(slots.B.editable.value);
            let eofA = extractEOF(slots.A.editable.value);
            let eofB = extractEOF(slots.B.editable.value);

            // Memecah array berdasarkan tanda slash
            let arrA = dataA.split('/');
            let arrB = dataB.split('/');
            
            let minLen = Math.min(arrA.length, arrB.length);
            
            // Menukar setiap segmen ke-2 (selang-seling)
            for(let i = 0; i < minLen; i++) {
                if(i % 2 === 0) {
                    let temp = arrA[i];
                    arrA[i] = arrB[i];
                    arrB[i] = temp;
                }
            }

            slots.A.editable.value = arrA.join('/') + eofA;
            slots.B.editable.value = arrB.join('/') + eofB;
            
            updatePreview('A'); updatePreview('B');
            statusLog.innerText = `Glitch diterapkan: Menukar ${Math.floor(minLen/2)} segmen yang dipisahkan oleh "/"`;
        });

        // ==========================================
        // MESIN 2: TEKNIK TUKAR BLOK BESAR (Lebih Stabil)
        // ==========================================
        document.getElementById('btnEngine2').addEventListener('click', () => {
            let dataA = removeEOF(slots.A.editable.value);
            let dataB = removeEOF(slots.B.editable.value);
            let eofA = extractEOF(slots.A.editable.value);
            let eofB = extractEOF(slots.B.editable.value);

            // Potong menjadi 20 blok besar
            const chunks = 20; 
            const chunkSizeA = Math.floor(dataA.length / chunks);
            const chunkSizeB = Math.floor(dataB.length / chunks);

            let newA = ""; let newB = "";

            for(let i = 0; i < chunks; i++) {
                let pieceA = dataA.substr(i * chunkSizeA, chunkSizeA);
                let pieceB = dataB.substr(i * chunkSizeB, chunkSizeB);

                // Tukar blok jika nomor blok ganjil
                if(i % 2 !== 0) {
                    newA += pieceB;
                    newB += pieceA;
                } else {
                    newA += pieceA;
                    newB += pieceB;
                }
            }

            // Tambahkan sisa data yang mungkin tertinggal karena pembulatan
            newA += dataA.slice(chunks * chunkSizeA) + eofA;
            newB += dataB.slice(chunks * chunkSizeB) + eofB;

            slots.A.editable.value = newA;
            slots.B.editable.value = newB;

            updatePreview('A'); updatePreview('B');
            statusLog.innerText = `Glitch diterapkan: Menukar blok data biner besar.`;
        });

        // Reset
        document.getElementById('btnReset').addEventListener('click', () => {
            slots.A.editable.value = originalDataA;
            slots.B.editable.value = originalDataB;
            updatePreview('A'); updatePreview('B');
            statusLog.innerText = "Data dikembalikan ke bentuk asli.";
        });

    </script>
</body>
</html>
