<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penggabung Grid Foto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .controls {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        input[type="file"] {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
        }
        .info-panel {
            background: #eaf2f8;
            padding: 10px 15px;
            border-radius: 4px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #2980b9;
        }
        .btn {
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #219653;
        }
        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #canvas-container {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: auto;
            display: flex;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h2>Aplikasi Penggabung Grid Foto (Kualitas Tinggi)</h2>

    <div class="controls">
        <input type="file" id="fileInput" multiple accept="image/*" title="Pilih beberapa foto sekaligus">
        
        <div id="infoPanel" class="info-panel" style="display: none;"></div>

        <button id="downloadBtn" class="btn" disabled>Unduh Hasil Gambar</button>
    </div>

    <div id="canvas-container">
        <canvas id="resultCanvas"></canvas>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const infoPanel = document.getElementById('infoPanel');
        const downloadBtn = document.getElementById('downloadBtn');

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            infoPanel.style.display = 'block';
            infoPanel.innerHTML = `Memproses ${files.length} gambar... (Ini mungkin memakan waktu untuk gambar beresolusi tinggi)`;
            downloadBtn.disabled = true;

            const images = [];
            let totalRatio = 0;
            let resolusiTertinggi = 0; // Variabel baru untuk mencari dimensi asli terbesar

            for (let file of files) {
                try {
                    const img = await loadImage(file);
                    images.push(img);
                    totalRatio += (img.width / img.height);
                    
                    // Cek sisi terpanjang gambar untuk mempertahankan kualitas asli
                    if (img.width > resolusiTertinggi) resolusiTertinggi = img.width;
                    if (img.height > resolusiTertinggi) resolusiTertinggi = img.height;
                } catch (err) {
                    console.error("Gagal memuat gambar:", file.name);
                }
            }

            const jumlahGambar = images.length;
            if (jumlahGambar === 0) {
                infoPanel.innerHTML = "Tidak ada gambar valid yang berhasil dimuat.";
                return;
            }

            const kolom = Math.ceil(Math.sqrt(jumlahGambar));
            const baris = Math.ceil(jumlahGambar / kolom);

            const rasioRataRata = totalRatio / jumlahGambar;
            
            // PERUBAHAN UTAMA: Menggunakan resolusi tertinggi dari gambar asli, bukan limit 800px
            const ukuranDasar = resolusiTertinggi; 
            let lebarSel = ukuranDasar;
            let tinggiSel = ukuranDasar;

            if (rasioRataRata > 1) {
                tinggiSel = ukuranDasar / rasioRataRata;
            } else {
                lebarSel = ukuranDasar * rasioRataRata;
            }

            canvas.width = kolom * lebarSel;
            canvas.height = baris * tinggiSel;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            infoPanel.innerHTML = `
                <strong>Jumlah File:</strong> ${jumlahGambar} | 
                <strong>Grid:</strong> ${kolom} Kolom x ${baris} Baris | 
                <strong>Resolusi Output:</strong> ${Math.round(canvas.width)} x ${Math.round(canvas.height)} px
            `;

            images.forEach((img, index) => {
                const posisiKolom = index % kolom;
                const posisiBaris = Math.floor(index / kolom);

                const dx = posisiKolom * lebarSel;
                const dy = posisiBaris * tinggiSel;

                const rasioGambar = img.width / img.height;
                const rasioSel = lebarSel / tinggiSel;

                let sx, sy, sw, sh;

                if (rasioGambar > rasioSel) {
                    sh = img.height;
                    sw = img.height * rasioSel;
                    sx = (img.width - sw) / 2;
                    sy = 0;
                } else {
                    sw = img.width;
                    sh = img.width / rasioSel;
                    sx = 0;
                    sy = (img.height - sh) / 2;
                }

                ctx.drawImage(img, sx, sy, sw, sh, dx, dy, lebarSel, tinggiSel);
            });

            downloadBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'hasil-grid-foto-highres.jpg';
            // PERUBAHAN: Kualitas diubah dari 0.9 menjadi 1.0 (kualitas maksimum)
            link.href = canvas.toDataURL('image/jpeg', 1.0); 
            link.click();
        });
    </script>
</body>
</html>
